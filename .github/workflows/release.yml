name: FolderBridge release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: folderbridge-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Windows regression tests and vet
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          $part = '(0|[1-9][0-9]*)'
          $stable = '^v' + $part + '\.' + $part + '\.' + $part + '$'
          if ($env:RELEASE_TAG -notmatch $stable) {
            throw 'Stable semantic version tag required (for example v3.3.1).'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          New-Item -ItemType Directory -Force dist/release | Out-Null
          $flags = '-s -w -H=windowsgui ' +
            "-X folderbridge/internal/app.Version=$version"
          go build -trimpath -ldflags $flags -o dist/release/FolderBridge.exe .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-FileHash dist/release/FolderBridge.exe -Algorithm SHA256
      - name: Create draft release (publish manually)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG dist/release/FolderBridge.exe `
            --draft --verify-tag --title "FolderBridge $env:RELEASE_TAG" `
            --generate-notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
